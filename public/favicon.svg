<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Three stacked boards, end-on. Chosen because it still reads as a lumber
    stack at 16px, where anything with fine detail becomes mush.
    Deliberately a fixed blue rather than var(--brand): a favicon is fetched
    outside the document, so it cannot see the dealer's runtime tokens.
  -->
  <rect width="32" height="32" rx="7" fill="#1e40af"/>
  <g fill="#fff">
    <rect x="6"  y="8"  width="20" height="5" rx="1.4" opacity=".95"/>
    <rect x="6"  y="14.5" width="20" height="5" rx="1.4" opacity=".8"/>
    <rect x="6"  y="21" width="20" height="5" rx="1.4" opacity=".62"/>
  </g>
</svg>
